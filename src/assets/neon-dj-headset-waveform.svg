<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 95 500 360" width="500" height="360" role="img" aria-label="Neon headset with a pink and orange waveform arching over it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Neon DJ headset</title>
  <defs>
    <linearGradient id="band" x1="190" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="0.5" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#ff8c1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* waveform bars: each one breathes around the arc's baseline, offsets make a slow rolling wave */
    .w       { animation: wave 8s ease-in-out infinite; transform-origin: 0 0; stroke-width: 7; stroke-linecap: round; }
    .headset { animation: flicker 12s ease-in-out infinite; }
    .bar     { animation: level 6s ease-in-out infinite; transform-origin: 0 372px; }
    .b1 { animation-delay: -1s; }  .b2 { animation-delay: -3.5s; }
    .b3 { animation-delay: -0.2s; } .b4 { animation-delay: -4.6s; }
    .b5 { animation-delay: -2.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.45); }
      50%      { transform: scaleY(1.1); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      48%      { opacity: 0.88; }
      50%      { opacity: 1; }
    }
    @keyframes level {
      0%, 100% { transform: scaleY(0.45); }
      50%      { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- waveform bent along an arc (baseline radius 170 around 300,340) -->
  <g filter="url(#glow)">
    <g transform="rotate(-80.00 300 340) translate(300 172)"><line class="w" x1="0" y1="-17.1" x2="0" y2="17.1" stroke="#ff2d95" style="animation-delay:0.00s"/></g>
    <g transform="rotate(-73.85 300 340) translate(300 172)"><line class="w" x1="0" y1="-13.1" x2="0" y2="13.1" stroke="#ff3190" style="animation-delay:-0.40s"/></g>
    <g transform="rotate(-67.69 300 340) translate(300 172)"><line class="w" x1="0" y1="-13.7" x2="0" y2="13.7" stroke="#ff348c" style="animation-delay:-0.80s"/></g>
    <g transform="rotate(-61.54 300 340) translate(300 172)"><line class="w" x1="0" y1="-29.4" x2="0" y2="29.4" stroke="#ff3887" style="animation-delay:-1.20s"/></g>
    <g transform="rotate(-55.38 300 340) translate(300 172)"><line class="w" x1="0" y1="-21.7" x2="0" y2="21.7" stroke="#ff3c82" style="animation-delay:-1.60s"/></g>
    <g transform="rotate(-49.23 300 340) translate(300 172)"><line class="w" x1="0" y1="-19.1" x2="0" y2="19.1" stroke="#ff3f7d" style="animation-delay:-2.00s"/></g>
    <g transform="rotate(-43.08 300 340) translate(300 172)"><line class="w" x1="0" y1="-24.7" x2="0" y2="24.7" stroke="#ff4379" style="animation-delay:-2.40s"/></g>
    <g transform="rotate(-36.92 300 340) translate(300 172)"><line class="w" x1="0" y1="-38.6" x2="0" y2="38.6" stroke="#ff4774" style="animation-delay:-2.80s"/></g>
    <g transform="rotate(-30.77 300 340) translate(300 172)"><line class="w" x1="0" y1="-19.5" x2="0" y2="19.5" stroke="#ff4a6f" style="animation-delay:-3.20s"/></g>
    <g transform="rotate(-24.62 300 340) translate(300 172)"><line class="w" x1="0" y1="-20.0" x2="0" y2="20.0" stroke="#ff4e6a" style="animation-delay:-3.60s"/></g>
    <g transform="rotate(-18.46 300 340) translate(300 172)"><line class="w" x1="0" y1="-36.2" x2="0" y2="36.2" stroke="#ff5266" style="animation-delay:-4.00s"/></g>
    <g transform="rotate(-12.31 300 340) translate(300 172)"><line class="w" x1="0" y1="-39.9" x2="0" y2="39.9" stroke="#ff5561" style="animation-delay:-4.40s"/></g>
    <g transform="rotate(-6.15 300 340) translate(300 172)"><line class="w" x1="0" y1="-18.3" x2="0" y2="18.3" stroke="#ff595c" style="animation-delay:-4.80s"/></g>
    <g transform="rotate(0.00 300 340) translate(300 172)"><line class="w" x1="0" y1="-18.0" x2="0" y2="18.0" stroke="#ff5c58" style="animation-delay:-5.20s"/></g>
    <g transform="rotate(6.15 300 340) translate(300 172)"><line class="w" x1="0" y1="-43.0" x2="0" y2="43.0" stroke="#ff6053" style="animation-delay:-5.60s"/></g>
    <g transform="rotate(12.31 300 340) translate(300 172)"><line class="w" x1="0" y1="-33.6" x2="0" y2="33.6" stroke="#ff644e" style="animation-delay:-6.00s"/></g>
    <g transform="rotate(18.46 300 340) translate(300 172)"><line class="w" x1="0" y1="-21.1" x2="0" y2="21.1" stroke="#ff6749" style="animation-delay:-6.40s"/></g>
    <g transform="rotate(24.62 300 340) translate(300 172)"><line class="w" x1="0" y1="-24.9" x2="0" y2="24.9" stroke="#ff6b45" style="animation-delay:-6.80s"/></g>
    <g transform="rotate(30.77 300 340) translate(300 172)"><line class="w" x1="0" y1="-41.8" x2="0" y2="41.8" stroke="#ff6f40" style="animation-delay:-7.20s"/></g>
    <g transform="rotate(36.92 300 340) translate(300 172)"><line class="w" x1="0" y1="-23.4" x2="0" y2="23.4" stroke="#ff723b" style="animation-delay:-7.60s"/></g>
    <g transform="rotate(43.08 300 340) translate(300 172)"><line class="w" x1="0" y1="-18.3" x2="0" y2="18.3" stroke="#ff7636" style="animation-delay:-8.00s"/></g>
    <g transform="rotate(49.23 300 340) translate(300 172)"><line class="w" x1="0" y1="-27.8" x2="0" y2="27.8" stroke="#ff7a32" style="animation-delay:-8.40s"/></g>
    <g transform="rotate(55.38 300 340) translate(300 172)"><line class="w" x1="0" y1="-32.4" x2="0" y2="32.4" stroke="#ff7d2d" style="animation-delay:-8.80s"/></g>
    <g transform="rotate(61.54 300 340) translate(300 172)"><line class="w" x1="0" y1="-13.9" x2="0" y2="13.9" stroke="#ff8128" style="animation-delay:-9.20s"/></g>
    <g transform="rotate(67.69 300 340) translate(300 172)"><line class="w" x1="0" y1="-11.7" x2="0" y2="11.7" stroke="#ff8523" style="animation-delay:-9.60s"/></g>
    <g transform="rotate(73.85 300 340) translate(300 172)"><line class="w" x1="0" y1="-22.7" x2="0" y2="22.7" stroke="#ff881f" style="animation-delay:-10.00s"/></g>
    <g transform="rotate(80.00 300 340) translate(300 172)"><line class="w" x1="0" y1="-18.2" x2="0" y2="18.2" stroke="#ff8c1a" style="animation-delay:-10.40s"/></g>
  </g>

  <!-- headset, drawn as neon tubes -->
  <g class="headset" filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190,350 V340 A110,110 0 0 1 410,340 V350" stroke="url(#band)" stroke-width="10"/>
    <path d="M206,346 A94,94 0 0 1 394,346" stroke="url(#band)" stroke-width="3" opacity="0.7"/>
    <rect x="164" y="330" width="52" height="96" rx="24" stroke="#ff2d95" stroke-width="8"/>
    <rect x="216" y="346" width="14" height="64" rx="7" stroke="#ff2d95" stroke-width="5"/>
    <rect x="384" y="330" width="52" height="96" rx="24" stroke="#ff8c1a" stroke-width="8"/>
    <rect x="370" y="346" width="14" height="64" rx="7" stroke="#ff8c1a" stroke-width="5"/>
  </g>

  <!-- small level meter between the cups -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-width="8">
    <line class="bar b1" x1="268" y1="372" x2="268" y2="352" stroke="#ff2d95"/>
    <line class="bar b2" x1="284" y1="372" x2="284" y2="336" stroke="#ff4677"/>
    <line class="bar b3" x1="300" y1="372" x2="300" y2="322" stroke="#ff5a5f"/>
    <line class="bar b4" x1="316" y1="372" x2="316" y2="336" stroke="#ff7340"/>
    <line class="bar b5" x1="332" y1="372" x2="332" y2="352" stroke="#ff8c1a"/>
  </g>
</svg>
