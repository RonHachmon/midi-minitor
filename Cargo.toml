[workspace]
members = ["crates/midi-core", "crates/midi-macos", "crates/midi-windows", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
specta = { version = "2.0.0-rc.22", features = ["derive"] }

# Warnings are errors here: with no test suite, the compiler is the only
# regression net the project has (see the constitution's Verification Standard).
[workspace.lints.rust]
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
