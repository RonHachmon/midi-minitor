<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 139 310 310" width="310" height="310" role="img" aria-label="Neon headset beneath a pink and orange waveform arc">
  <title>MIDI Monitor icon</title>

  <!--
    The icon cut of src/assets/neon-dj-headset-waveform.svg.

    Regenerate the icon set with `npm run tauri icon app-icon.svg`, then delete
    the android/ and ios/ directories it writes -- this is a desktop-only app and
    those sets are never bundled. The CLI rasterises this file itself, so there
    is no intermediate PNG to keep in sync.

    This is build-time input, not a bundled asset, which is why it sits at the
    project root next to that command rather than in src/assets/ with the artwork
    the webview imports.

    Changing this file alone does not change the running app on Windows: the .ico
    is embedded into the executable as a resource, and cargo will not rebuild for
    an icon it does not track. Touch src-tauri/tauri.conf.json to force it.

    Three deliberate differences from the artwork, all of them about surviving
    32x32:

    - Eleven waveform bars instead of twenty-seven, each roughly twice as thick.
      At icon sizes the original's bars fall below a pixel and merge into a fuzzy
      halo; a coarser wave keeps a readable silhouette all the way down.
    - A square crop that the drawing fills. The artwork is a 500x360 landscape
      and letterboxing it into a square spent a third of the icon on nothing, so
      the arc is pulled in close to the headband to square the composition up.
    - A tighter glow. The original's wide blur is drawn for a dark ground; on a
      transparent icon over a light taskbar it reads as haze rather than light.

    No animation here on purpose: this file is only ever rasterised, and a
    keyframe would just make the render depend on when the frame was grabbed.
  -->

  <defs>
    <linearGradient id="band" x1="190" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="0.5" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#ff8c1a"/>
    </linearGradient>
    <linearGradient id="arc" x1="160" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="0.5" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#ff8c1a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="bloom"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- waveform, bent along an arc that hugs the headband (centre 300,340) -->
  <g filter="url(#glow)" stroke="url(#arc)" stroke-width="13" stroke-linecap="round">
    <g transform="rotate(-70 300 340) translate(300 206)"><line x1="0" y1="-10" x2="0" y2="10"/></g>
    <g transform="rotate(-56 300 340) translate(300 198)"><line x1="0" y1="-18" x2="0" y2="18"/></g>
    <g transform="rotate(-42 300 340) translate(300 209)"><line x1="0" y1="-7"  x2="0" y2="7"/></g>
    <g transform="rotate(-28 300 340) translate(300 193)"><line x1="0" y1="-23" x2="0" y2="23"/></g>
    <g transform="rotate(-14 300 340) translate(300 203)"><line x1="0" y1="-13" x2="0" y2="13"/></g>
    <g transform="rotate(0 300 340)   translate(300 190)"><line x1="0" y1="-26" x2="0" y2="26"/></g>
    <g transform="rotate(14 300 340)  translate(300 204)"><line x1="0" y1="-12" x2="0" y2="12"/></g>
    <g transform="rotate(28 300 340)  translate(300 194)"><line x1="0" y1="-22" x2="0" y2="22"/></g>
    <g transform="rotate(42 300 340)  translate(300 208)"><line x1="0" y1="-8"  x2="0" y2="8"/></g>
    <g transform="rotate(56 300 340)  translate(300 199)"><line x1="0" y1="-17" x2="0" y2="17"/></g>
    <g transform="rotate(70 300 340)  translate(300 205)"><line x1="0" y1="-11" x2="0" y2="11"/></g>
  </g>

  <!-- headset, drawn as neon tubes -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190,350 V340 A110,110 0 0 1 410,340 V350" stroke="url(#band)" stroke-width="12"/>
    <path d="M206,346 A94,94 0 0 1 394,346" stroke="url(#band)" stroke-width="4" opacity="0.65"/>
    <rect x="164" y="330" width="52" height="96" rx="24" stroke="#ff2d95" stroke-width="9"/>
    <rect x="216" y="346" width="14" height="64" rx="7" stroke="#ff2d95" stroke-width="6"/>
    <rect x="384" y="330" width="52" height="96" rx="24" stroke="#ff8c1a" stroke-width="9"/>
    <rect x="370" y="346" width="14" height="64" rx="7" stroke="#ff8c1a" stroke-width="6"/>
  </g>

  <!-- level meter between the cups -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-width="9">
    <line x1="268" y1="372" x2="268" y2="352" stroke="#ff2d95"/>
    <line x1="284" y1="372" x2="284" y2="336" stroke="#ff4677"/>
    <line x1="300" y1="372" x2="300" y2="322" stroke="#ff5a5f"/>
    <line x1="316" y1="372" x2="316" y2="336" stroke="#ff7340"/>
    <line x1="332" y1="372" x2="332" y2="352" stroke="#ff8c1a"/>
  </g>
</svg>
