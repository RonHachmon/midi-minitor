[package]
name = "midi-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mock MIDI Monitor desktop application."

[lib]
name = "midi_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
midi-core = { path = "../crates/midi-core" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
specta.workspace = true
specta-typescript = "0.0.12"
chrono = "0.4.45"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }

# The platform adapters. This crate is the composition root, so it is the one
# place allowed to name both the ports and the implementations behind them —
# and `src/platform.rs` is the one file allowed to say which is which.
#
# Gated by target rather than listed unconditionally so the wrong platform's
# adapter is never built. Without this, a Windows build would still compile the
# CoreMIDI crate to an empty shell and a macOS build would still compile the
# WinMM one, which is wasted work at best and a broken build at worst.
#
# `libc` and the `windows` performance counter are here, in the composition
# root, because `SystemClock` is here. The Time column's three `Host time`
# formats need a host-clock reading, and this crate already owns the one type
# that answers "what time is it" for the whole application. The platform
# adapters do not gain these dependencies: they reach the clock through
# `midi_core::application::ports::Clock`, exactly as they always have.
#
# Principle II asks why neither is hand-rolled. `coremidi-sys` exposes the
# CoreMIDI surface but no timebase function, so it cannot serve; `mach2` would
# work but adds a crate for one call that `libc` — already in the tree —
# declares. Writing the `mach` or `kernel32` signatures by hand is the
# re-solving `midi-windows` already rejects for `MIDIHDR`, and for the same
# reason: a mistyped field is a silent memory bug rather than a compile error.
# See specs/006-display-preferences/research.md, decision D3.
[target.'cfg(target_os = "macos")'.dependencies]
midi-macos = { path = "../crates/midi-macos" }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
midi-windows = { path = "../crates/midi-windows" }
windows = { version = "0.62", features = ["Win32_System_Performance"] }

[lints]
workspace = true
