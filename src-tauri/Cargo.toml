[package]
name = "midi-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mock MIDI Monitor desktop application."

[lib]
name = "midi_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
midi-core = { path = "../crates/midi-core" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
specta.workspace = true
specta-typescript = "0.0.12"
chrono = "0.4.45"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }

# The platform adapters. This crate is the composition root, so it is the one
# place allowed to name both the ports and the implementations behind them —
# and `src/platform.rs` is the one file allowed to say which is which.
#
# Gated by target rather than listed unconditionally so the wrong platform's
# adapter is never built. Without this, a Windows build would still compile the
# CoreMIDI crate to an empty shell and a macOS build would still compile the
# WinMM one, which is wasted work at best and a broken build at worst.
[target.'cfg(target_os = "macos")'.dependencies]
midi-macos = { path = "../crates/midi-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
midi-windows = { path = "../crates/midi-windows" }

[lints]
workspace = true
